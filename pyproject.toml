[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.1.0"
description = "Adversarial fraud-data foundry and Mandate Firewall for agentic commerce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Kept to wheels that install cleanly with no compiler,
# no GPU and no credentials — see CLAUDE.md HARD RULE 4.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    # Parquet is the population interchange format between foundry and defense.
    "pyarrow>=15.0",
    # Calibration + fidelity figures. Imported lazily and guarded: a clone
    # without it still generates the population and still prints the metrics.
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["mantis*"]

[tool.setuptools.package-data]
# The discovered cards are generated by `python -m mantis.loop`, and they are
# packaged and committed for the same reason the LLM cache is: a judge cloning
# this repo should see what the adversarial loop found without running it for
# half an hour. `load_discovered` returns {} when the directory is absent, so a
# clone that has never run the loop is a normal state rather than a broken one.
mantis = ["atlas/cards/*.yaml", "atlas/discovered/*.yaml", "atlas/discovered/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# `X` for a feature matrix is the universal convention in ML code; lowercasing
# it to satisfy pep8-naming would make these modules read worse, not better.
"mantis/defense/l1_gbdt/*" = ["N803", "N806"]
"mantis/defense/l2_novelty/*" = ["N803", "N806"]
"mantis/defense/l3_text/*" = ["N803", "N806"]
"mantis/defense/l4_graph/*" = ["N803", "N806"]
"mantis/defense/fusion/*" = ["N803", "N806"]
"mantis/defense/explain/*" = ["N803", "N806"]
"mantis/loop/*" = ["N803", "N806"]
"scripts/*" = ["N803", "N806"]
"mantis/defense/experiment.py" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
