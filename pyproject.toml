[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.1.0"
description = "Adversarial fraud-data foundry and Mandate Firewall for agentic commerce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Kept to wheels that install cleanly with no compiler,
# no GPU and no credentials — see CLAUDE.md HARD RULE 4.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    # Parquet is the population interchange format between foundry and defense.
    "pyarrow>=15.0",
    # Calibration + fidelity figures. Imported lazily and guarded: a clone
    # without it still generates the population and still prints the metrics.
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["mantis*"]

[tool.setuptools.package-data]
mantis = ["atlas/cards/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
