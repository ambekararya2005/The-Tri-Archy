id: F1-50
name: Cart-mandate tampering via indirect prompt injection — evasive variant 14019
family: F1
status: mapped
rails:
- agentic
- ecom
actor: An operator who controls third-party content a shopping agent reads — a marketplace listing, a
  review block, a comparison page. No access to the issuer, the customer's device, or the mandate signing
  key is required, which is precisely what makes this cheap.
genai_enabler: 'The variant was not written by a person. It was found by MANTIS''s own evolutionary adversary,
  which mutates the operational parameters of a known attack and selects on evasion x payoff against the
  live detector — the same loop an operator runs when their attempts start getting declined, except that
  here the defender runs it first. The agent cannot reliably separate retrieved content from instructions,
  so text placed in a product description is processed as direction rather than data. GenAI also makes
  the payload itself disposable: injection strings can be generated, varied and A/B-tested against agent
  behaviour at negligible cost.'
description: 'A variant of F1-01 discovered by the adversarial loop. It evaded 11% of the detector''s
  decisions at the 0.1% false-positive operating point while retaining 0.04x the parent attack''s realised
  payoff, and survived 4 consecutive rounds of retraining. What changed: ticket size reduced to 0.54x
  the parent attack''s, trading payoff per event against the per-customer amount baselines; the ring is
  split into roughly 2 sub-rings, so no single campaign carries enough volume to be worth an alert; about
  56% of the merchant legs are re-drawn from ordinary popular merchants, diluting beneficiary concentration;
  about 63% of events are moved onto rotated devices, breaking the shared-device edges that make an identity
  component visible; activity shifted 4.3 hours later in the day; about 36% of the injected pages are
  replaced with innocuous content, so the provenance trail carries less instruction-shaped text for a
  reader to find; agent deliberation latency stretched to 3.6x, which is a direct answer to the deliberation-residual
  feature. The underlying attack is unchanged — see F1-01 for what it is and why it works.'
preconditions:
- Agent operates under a cart mandate whose scope was fixed before the final basket was assembled.
- Agent ingests untrusted third-party content between mandate issuance and authorisation.
- Basket contents are not re-confirmed with the human after that ingestion.
observable_signals:
- signal: Authorised merchant or MCC is absent from the mandate scope the human agreed to.
  feature: mandate_scope_violation
  layer: L0
- signal: Settled amount exceeds the cart ceiling the human saw, usually by a modest margin chosen to
    stay under review thresholds.
  feature: amount_to_scope_max_ratio
  layer: L1
- signal: Provenance chain contains a domain never before seen for this customer, ingested immediately
    before the scope excursion.
  feature: provenance_chain_novel_domain_ratio
  layer: L3
- signal: Ingested content carries imperative, agent-directed language — instruction-shaped text where
    a product description should be.
  feature: provenance_injection_score
  layer: L3
- signal: Deliberation collapses; the agent commits with far less reasoning latency than a comparable
    legitimate purchase of the same size.
  feature: deliberation_latency_z
  layer: L1
mitigations:
- Bind the mandate hash to the final basket and re-verify the binding at authorisation time.
- Treat all retrieved content as data — strip or quarantine instruction-shaped text before it reaches
  the planner.
- Require explicit human re-confirmation whenever the basket changes after content ingestion.
- Enforce merchant allow-lists at the network rather than inside the agent, so a compromised planner cannot
  widen its own scope.
generator: null
detected_by:
- L0
- L1
- L3
